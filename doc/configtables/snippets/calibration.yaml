calibration:
  enable: false          # apply the steps below in prepare_network
  brownfield_only: false # true: freeze every generator and drop the extendable stores -> pure dispatch of the existing fleet (lines follow `ll`)
  efficiency_spread: 0.  # > 0: split every fuel-burning generator into `tranches` parts with efficiencies x(1-spread)..x(1+spread)
  tranches: 3
  net_import_tolerance: 0.25 # half-width of the annual net-import band, relative to the target (floor 1 TWh)
  energy_bands: {}       # fuel group -> [lower, upper] factor on the observed annual generation (tables.generation), e.g.
                         # {coal: [0.85, 1.15], gas: [null, 1.15]}: solve-time constraints on the group's annual generation
  energy_band_penalty: 200 # [currency/MWh] outside the band (soft constraint); false or 0 for hard bands
  net_imports: false     # true: annual net imports of statistics/net_imports.csv (country, net_imports_twh), enforced as a band in solve_network
                         # energy_bands read statistics/generation.csv (country, group, twh) and statistics/demand.csv
                         # (country, demand_twh: exporters, generation > 1.05 x demand, get no band floor)
